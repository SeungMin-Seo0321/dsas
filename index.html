<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiliconFlow AI Studio - Pro</title>
    <style>
        :root { --bg: #0b0f1a; --card: #161e2d; --text: #e2e8f0; --accent: #10b981; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 1100px; display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .panel { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #2d3748; }
        h3 { margin-top: 0; color: var(--accent); border-bottom: 1px solid #2d3748; padding-bottom: 10px; }
        .group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #94a3b8; }
        input, select, textarea { width: 100%; padding: 10px; background: #0b0f1a; border: 1px solid #2d3748; color: white; border-radius: 6px; box-sizing: border-box; }
        .range-box { display: flex; align-items: center; gap: 10px; }
        button { width: 100%; padding: 15px; background: var(--accent); border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { filter: brightness(1.1); }
        .display-area { display: grid; grid-template-rows: auto 1fr; gap: 20px; }
        .preview-box { background: #000; border-radius: 8px; min-height: 200px; display: flex; align-items: center; justify-content: center; border: 2px dashed #2d3748; }
        img { max-width: 100%; max-height: 500px; border-radius: 4px; }
        #status { text-align: center; color: var(--accent); font-weight: bold; margin-top: 10px; display: none; }
        .mode-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: #2d3748; margin-left: 10px; vertical-align: middle; }
    </style>
</head>
<body>

<div class="container">
    <div class="panel">
        <h3>Controls</h3>
        <div class="group">
            <label>SiliconFlow API Key</label>
            <input type="password" id="apiKey" placeholder="sk-...">
        </div>
        <div class="group">
            <label>Model <span class="mode-badge" id="modeTag">Text2Img 모드</span></label>
            <select id="model">
                <option value="stabilityai/stable-diffusion-xl-base-1.0">SDXL Base (표준 실사)</option>
                <option value="cagliostrolab/animagine-xl-3.1">Animagine XL (애니/미소녀)</option>
                <option value="black-forest-labs/FLUX.1-schnell">FLUX.1 (최고 화질)</option>
            </select>
        </div>
        <div class="group">
            <label>Prompt (묘사)</label>
            <textarea id="prompt" rows="4">A girl in thin white silk tight shirt, highly detailed fabric, realistic body line, cinematic lighting</textarea>
        </div>
        <div class="group" id="strengthGroup" style="display: none;">
            <label>Original Strength (원본 반영: 낮을수록 비슷함)</label>
            <div class="range-box">
                <input type="range" id="strength" min="0.1" max="0.9" step="0.05" value="0.55">
                <span id="stLabel">0.55</span>
            </div>
        </div>
        <div class="group">
            <label>Image Upload (비워두면 새로 생성)</label>
            <input type="file" id="imgInput" accept="image/*">
            <button style="background:#4a5568; font-size: 0.8rem; padding: 5px; margin-top: 5px;" onclick="clearImage()">사진 취소 (새로 만들기 모드)</button>
        </div>
        <button id="runBtn">AI 실행하기</button>
        <div id="status">처리 중...</div>
    </div>

    <div class="display-area">
        <div class="panel">
            <label>결과 이미지</label>
            <div id="resultArea" class="preview-box">여기에 이미지가 나타납니다</div>
        </div>
        <div class="panel" id="previewPanel" style="display:none;">
            <label>원본 미리보기</label>
            <div id="previewArea" class="preview-box"></div>
        </div>
    </div>
</div>

<script>
    let base64Img = null;

    const imgInput = document.getElementById('imgInput');
    const strengthGroup = document.getElementById('strengthGroup');
    const modeTag = document.getElementById('modeTag');
    const stInput = document.getElementById('strength');
    const stLabel = document.getElementById('stLabel');

    // 이미지 로드 시 모드 변경
    imgInput.onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            base64Img = reader.result;
            document.getElementById('previewArea').innerHTML = `<img src="${base64Img}">`;
            document.getElementById('previewPanel').style.display = 'block';
            strengthGroup.style.display = 'block';
            modeTag.innerText = "Img2Img 모드";
            modeTag.style.background = "#065f46";
        };
        reader.readAsDataURL(file);
    };

    function clearImage() {
        imgInput.value = "";
        base64Img = null;
        strengthGroup.style.display = 'none';
        document.getElementById('previewPanel').style.display = 'none';
        modeTag.innerText = "Text2Img 모드";
        modeTag.style.background = "#2d3748";
    }

    stInput.oninput = () => stLabel.innerText = stInput.value;

    document.getElementById('runBtn').onclick = async () => {
        const key = document.getElementById('apiKey').value;
        const prompt = document.getElementById('prompt').value;
        if(!key) return alert("API Key를 입력하세요!");

        const status = document.getElementById('status');
        const resultArea = document.getElementById('resultArea');
        
        status.style.display = 'block';
        resultArea.style.opacity = '0.5';

        try {
            const body = {
                model: document.getElementById('model').value,
                prompt: prompt,
                negative_prompt: "ugly, blurry, low quality, baggy clothes",
                batch_size: 1
            };

            // 사진이 있으면 Img2Img, 없으면 Text2Img로 자동 전환
            if(base64Img) {
                body.image = base64Img;
                body.strength = parseFloat(stInput.value);
            }

            const resp = await fetch('https://api.siliconflow.cn/v1/image/generations', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const resData = await resp.json();
            if(resData.images) {
                resultArea.innerHTML = `<img src="${resData.images[0].url}">`;
            } else {
                alert("오류: " + (resData.message || "생성 실패"));
            }
        } catch (e) {
            alert("네트워크 오류!");
        } finally {
            status.style.display = 'none';
            resultArea.style.opacity = '1';
        }
    };
</script>
</body>
</html>
